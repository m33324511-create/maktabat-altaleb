name: Fix public books loading endpoint

on:
  push:
    paths:
      - '.github/workflows/fix-books-endpoint.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Switch books loading to Edge Function
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('async function loadCloudBooks(){')
          end=s.index('\nfunction filterBooks', start)
          new="""async function loadCloudBooks(){const g=document.getElementById('bookGrid');g.innerHTML='<div class=\"empty\" style=\"grid-column:1/-1\"><div class=\"big\">⏳</div><h3>جاري تحميل الكتب...</h3><p>لحظات ونظهر الكتب الموجودة.</p></div>';try{const r=await fetch(UPLOAD_FUNCTION,{method:'GET',cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const rows=await r.json();books.length=0;rows.forEach(b=>books.push({id:b.id,title:b.title,subject:b.subject,description:b.description,file:b.file_url||b.external_url||'',external_url:b.external_url||'',cover:b.cover_url||''}));render()}catch(e){console.error('BOOKS LOAD ERROR:',e);g.innerHTML='<div class=\"empty\" style=\"grid-column:1/-1\"><div class=\"big\">⚠️</div><h3>تعذر تحميل الكتب</h3><p>حدث خطأ مؤقت أثناء جلب الكتب. حاول تحديث الصفحة.</p></div>'}}"""
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use Edge Function for public books loading'
          git push
