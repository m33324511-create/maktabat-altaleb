name: Update site description

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-description:
    if: github.event.head_commit.message != 'Update site description automatically'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update description
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'مكتبة الطالب الدحيح: مكتبة إلكترونية للكتب والمراجع والمذكرات والملفات التعليمية للطلاب.'
          new = 'مكتبة الطالب الدحيح: مكتبة تعليمية مجانية توفر الكتب والمذكرات والمراجع والملفات التعليمية، مع سهولة البحث والوصول إلى المواد الدراسية وتحميلها في مكان واحد.'
          if old not in s:
              raise SystemExit('old description not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update site description automatically'
          git push
