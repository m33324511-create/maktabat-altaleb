name: Fix book loading

on:
  push:
    paths:
      - '.github/workflows/fix-books.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix uploadBook declaration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'function uploadBook(){'
          new = 'async function uploadBook(){'
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix uploadBook async declaration'
          git push
