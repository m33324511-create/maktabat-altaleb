name: Fix books query

on:
  push:
    paths:
      - '.github/workflows/fix-books-query.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix Supabase books query
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const base=SUPABASE_URL+'/rest/v1/books?select=id,title,subject,description,file_path,file_url,external_url,cover_url,cover_path,created_at&order=created_at.desc';"
          new = "const base=SUPABASE_URL+'/rest/v1/books?select=id,title,subject,description,external_url,created_at&order=created_at.desc';"
          if old not in s:
              raise SystemExit('old query not found')
          s = s.replace(old, new, 1)
          old2 = "file:b.file_url,external_url:b.external_url,cover:b.cover_url,file_path:b.file_path,cover_path:b.cover_path"
          new2 = "file:b.external_url,external_url:b.external_url"
          if old2 not in s:
              raise SystemExit('old mapping not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix books loading query'
          git push
